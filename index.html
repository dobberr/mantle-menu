<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0f;
    --surface: #121217;
    --surface-2: #18181e;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.17);
    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --accent: #22d3ee;
    /* Motion system: expo-out entrances, spring micro-interactions */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Geist', sans-serif;
    --r-surface: 16px;
    --r-chip: 12px;
    --r-go: 10px;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    padding: 36px clamp(16px, 4vw, 22px);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: rgba(34,211,238,0.25); }

  /* Background: cyan aurora top-center + faint indigo under-glow,
     with a dot field masked to an ellipse around the top glow so the
     corners stay completely clean. */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(820px 380px at 50% -10%, rgba(34,211,238,0.10), transparent 70%),
      radial-gradient(560px 320px at 50% 112%, rgba(88,101,242,0.055), transparent 72%);
  }
  .bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 72% 62% at 50% 6%, black 10%, transparent 72%);
    mask-image: radial-gradient(ellipse 72% 62% at 50% 6%, black 10%, transparent 72%);
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 540px; margin: auto; }

  /* Header — centered */
  header { text-align: center; margin-bottom: 26px; }
  header img {
    display: block;
    width: min(340px, 92%);
    height: auto;
    margin: 0 auto 12px;
    user-select: none;
    -webkit-user-drag: none;
  }
  header p {
    margin: 0 auto; max-width: 44ch;
    font-size: 13.5px; font-weight: 400; letter-spacing: 0.01em;
    color: var(--text-2);
  }

  /* Bento grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .span-2 { grid-column: span 2; }

  .cell {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-surface);
    cursor: pointer; text-align: left;
    font-family: inherit; font-size: inherit; color: inherit;
    text-decoration: none; user-select: none;
    transition-property: background-color, border-color, transform, box-shadow;
    transition-duration: 0.25s;
    transition-timing-function: var(--ease-out);
  }
  .cell:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .cell:active { transform: translateY(0) scale(0.985); transition-duration: 0.1s; }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Pointer spotlight: soft interior wash + border ring glow.
     --mx/--my set by JS; --glow is each card's identity color. */
  .cell::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 65%);
    opacity: 0; transition: opacity 0.3s var(--ease-out);
    pointer-events: none;
  }
  .cell::after {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--glow-strong), transparent 65%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
    opacity: 0; transition: opacity 0.3s var(--ease-out);
    pointer-events: none;
  }
  .cell:hover::before, .cell:hover::after { opacity: 1; }

  .mineral { --glow: rgba(34,211,238,0.06);  --glow-strong: rgba(34,211,238,0.35);
    background: linear-gradient(130deg, rgba(34,211,238,0.05), transparent 42%), var(--surface); }
  .mineral:hover { background: linear-gradient(130deg, rgba(34,211,238,0.08), transparent 45%), var(--surface-2); }
  .slate   { --glow: rgba(52,211,153,0.06);  --glow-strong: rgba(52,211,153,0.35); }
  .magma   { --glow: rgba(251,146,60,0.06);  --glow-strong: rgba(251,146,60,0.35); }
  .quiet   { --glow: rgba(88,101,242,0.07);  --glow-strong: rgba(88,101,242,0.45); }

  .compact { flex-direction: column; align-items: flex-start; gap: 10px; padding-bottom: 46px; }
  .compact .go { position: absolute; right: 12px; bottom: 12px; }

  .chip {
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-chip);
    border: 1px solid;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .chip svg { width: 21px; height: 21px; }
  .chip-mineral { color: #22d3ee; background: rgba(34,211,238,0.08);  border-color: rgba(34,211,238,0.22); }
  .chip-slate   { color: #34d399; background: rgba(52,211,153,0.08);  border-color: rgba(52,211,153,0.20); }
  .chip-magma   { color: #fb923c; background: rgba(251,146,60,0.08);  border-color: rgba(251,146,60,0.20); }
  .chip-discord { color: #7d87f6; background: rgba(88,101,242,0.12);  border-color: rgba(88,101,242,0.28); }

  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .compact .meta { gap: 2px; }
  .name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-1); }
  .name-sm { font-size: 14.5px; }
  .desc { font-size: 12.5px; color: var(--text-2); line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact .desc {
    white-space: normal; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* Arrow chip: 1px optical offset; spring slide on hover */
  .go {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: var(--r-go);
    transition-property: background-color, border-color, color, transform;
    transition-duration: 0.25s;
    transition-timing-function: var(--ease-out);
  }
  .go svg {
    width: 15px; height: 15px;
    translate: -1px 0;
    transition: transform 0.3s var(--ease-spring);
  }
  .cell:hover .go { background: #ffffff; border-color: #ffffff; color: #0b0b0f; }
  .cell:hover .go svg { transform: translateX(3px); }
  .cell:active .go { transform: scale(0.94); }

  .quiet { background: transparent; border: 1px dashed rgba(255,255,255,0.14); }
  .quiet:hover {
    background: rgba(255,255,255,0.02);
    border-color: var(--border-strong);
    transform: none;
    box-shadow: none;
  }
  .quiet:hover::before, .quiet:hover::after { opacity: 0; }
  .pill {
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-1);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 5px 13px;
    transition-property: background-color, border-color, color;
    transition-duration: 0.2s;
    transition-timing-function: var(--ease-out);
  }
  .quiet:hover .pill { background: #5865F2; border-color: #5865F2; color: #ffffff; }

  /* Footer — centered */
  footer { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  footer .mark {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.4em; text-indent: 0.4em; text-transform: uppercase;
    color: var(--text-2);
  }
  footer .est {
    font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-3);
  }

  /* ===== Motion choreography ===== */
  @media (prefers-reduced-motion: no-preference) {
    .rise {
      opacity: 0;
      animation: rise 0.7s var(--ease-out) forwards;
      animation-delay: var(--delay, 0s);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
    .modal-backdrop { animation: backdropIn 0.22s ease both; }
    .modal-card     { animation: cardIn 0.32s var(--ease-out) both; }
    .modal-backdrop.closing { animation: backdropOut 0.16s ease both; }
    .modal-backdrop.closing .modal-card { animation: cardOut 0.16s ease both; }
    @keyframes backdropIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes backdropOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes cardOut {
      from { opacity: 1; transform: none; filter: blur(0); }
      to   { opacity: 0; transform: translateY(6px) scale(0.97); filter: blur(4px); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell, .go, .go svg, .pill, .cell::before, .cell::after { transition: none; }
    .rise { opacity: 1; animation: none; }
  }

  /* Responsive: single column below 620px, tighter header on short windows */
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .span-2 { grid-column: span 1; }
  }
  @media (max-height: 640px) {
    body { padding-top: 24px; padding-bottom: 24px; }
    header { margin-bottom: 18px; }
    header img { width: min(260px, 80%); }
  }
</style>
</head>

<body>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  mineral: "https://dobberr.github.io/min/",
  slate: "https://slate-mantle.laneesports.com",
  magma: "https://abyss-gold-theta.vercel.app/"
};

// Spoofing is POPUP-ONLY. The shell owns the launcher tab;
// the hub runs in an iframe, where title/favicon changes are inert.
const SPOOF_OPTIONS = [
  { title: "Google", icon: "https://www.google.com/favicon.ico" },
  { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
  { title: "Google Drive", icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
  { title: "Google Docs", icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" }
];

const WINDOW_FEATURES = "width=" + screen.width + ",height=" + screen.height +
  ",menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes,popup=yes";

/* ============================================================
   POINTER SPOTLIGHT — feeds --mx/--my to each card's glow
   ============================================================ */
document.querySelectorAll(".cell").forEach(function (card) {
  card.addEventListener("pointermove", function (e) {
    var r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
});

/* ============================================================
   MODAL CHOREOGRAPHY — shared open/close with exit animations
   ============================================================ */
function closeModal(id) {
  var m = document.getElementById(id);
  if (!m) return;
  m.classList.add("closing");
  m.addEventListener("animationend", function (e) {
    if (e.target === m) m.remove();
  }, { once: true });
}

/* ============================================================
   POPUP SPOOF HELPERS
   ============================================================ */
function applySpoof(targetDoc, spoof) {
  targetDoc.title = spoof.title;
  var link = targetDoc.querySelector("link[rel~='icon']");
  if (!link) { link = targetDoc.createElement('link'); link.rel = 'icon'; targetDoc.head.appendChild(link); }
  link.href = spoof.icon;
}

function pickSpoof() {
  return SPOOF_OPTIONS[Math.floor(Math.random() * SPOOF_OPTIONS.length)];
}

// Re-asserts the spoof on a popup until it closes (game pages reset
// <title> as they parse, so the interval wins the race).
function keepSpoofed(d, spoof) {
  applySpoof(d, spoof);
  var t = setInterval(function () {
    try { applySpoof(d, spoof); } catch (e) { clearInterval(t); }
  }, 500);
}

/* ============================================================
   LAUNCHERS — popup + iframe flow
   ============================================================ */
function launchWithSpoof(url, showNoticeBanner = false) {
  var win = window.open("about:blank", "_blank", WINDOW_FEATURES);
  if (!win) { alert("Please allow popups."); return; }

  var d = win.document;
  d.open();
  d.write(`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;padding:0;background:#000;overflow:hidden;width:100vw;height:100vh;"></body></html>`);
  d.close();

  keepSpoofed(d, pickSpoof());

  var frame = d.createElement('iframe');
  frame.src = url;
  frame.style.width = "100vw";
  frame.style.height = "100vh";
  frame.style.border = "none";
  frame.style.display = "block";
  frame.setAttribute("allow", "fullscreen; pointer-lock; gamepad; keyboard-map; clipboard-read; clipboard-write; camera; microphone");
  frame.setAttribute("sandbox", "allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock");
  frame.setAttribute("allowfullscreen", "true");
  d.body.appendChild(frame);

  if (showNoticeBanner) {
    var banner = d.createElement('div');
    banner.style.cssText = "position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999999; width: 90%; max-width: 480px; background: rgba(69, 26, 3, 0.9); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; backdrop-filter: blur(8px); padding: 16px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; align-items: flex-start; gap: 12px; font-family: sans-serif; opacity: 0; transition: opacity 0.5s ease; box-sizing: border-box;";
    banner.innerHTML = `
      <svg style="width: 20px; height: 20px; color: #fbbf24; flex-shrink: 0; margin-top: 2px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div style="flex: 1; font-size: 13px; line-height: 1.5; min-w-0;">
        <strong style="display: block; color: #fcd34d; margin-bottom: 4px; font-size: 14px;">Account Inactivity Notice</strong>
        To keep Slate completely free for active users, any accounts left inactive for 3+ months are automatically deleted to free up system space. You can always remake an account if yours gets removed.
      </div>
      <button style="background: transparent; border: none; color: rgba(251, 191, 36, 0.6); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;" onmouseover="this.style.color='#fde68a'" onmouseout="this.style.color='rgba(251, 191, 36, 0.6)'">&times;</button>
    `;
    d.body.appendChild(banner);

    var closeBtn = banner.querySelector('button');
    var timeoutId;
    function closeBanner() {
      banner.style.opacity = '0';
      setTimeout(() => { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 500);
      clearTimeout(timeoutId);
    }
    closeBtn.onclick = closeBanner;
    setTimeout(() => { banner.style.opacity = '1'; }, 100);
    timeoutId = setTimeout(closeBanner, 20000);
  }
}

function openSlateLegalDocs() {
  var existingModal = document.getElementById('slate-privacy-modal');
  if (existingModal) existingModal.remove();

  var modal = document.createElement('div');
  modal.id = "slate-privacy-modal";
  modal.className = "modal-backdrop";
