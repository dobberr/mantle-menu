<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --surface: #101013;
    --surface-2: #16161b;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.16);
    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #8b8b94;
    --accent: #22d3ee;
    --discord: #5865F2;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Geist', sans-serif;
    /* Radius system: surfaces 16px, inner tiles/chips 10px, pills 999px */
    --r-surface: 16px;
    --r-tile: 10px;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    padding: 40px 20px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  ::selection { background: rgba(34,211,238,0.25); }

  .bg-glow, .bg-dots { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg-glow { background: radial-gradient(640px 320px at 50% -6%, rgba(34,211,238,0.07), transparent 70%); }
  .bg-dots {
    background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 80%);
    mask-image: linear-gradient(to bottom, black, transparent 80%);
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 520px; margin: auto; }

  /* Header */
  header { text-align: center; margin-bottom: 40px; }
  header img {
    display: block; width: 210px; max-width: 78%; height: auto;
    margin: 0 auto 16px;
    user-select: none; -webkit-user-drag: none;
  }
  header p {
    margin: 0 auto; max-width: 42ch;
    font-size: 13.5px; font-weight: 400; letter-spacing: 0.01em;
    color: var(--text-2);
  }

  /* App rows */
  .apps { display: flex; flex-direction: column; gap: 10px; }

  .row {
    display: flex; align-items: icon tile; gap: 14px;
    width: 100%; padding: 12px 14px;
    font-family: inherit; font-size: inherit; color: inherit; text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-surface);
    cursor: pointer;
    text-decoration: none;
    user-select: none;
    transition-property: background-color, border-color, box-shadow, transform;
    transition-duration: 0.2s;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  .row:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tile {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--r-tile);
    color: #d4d4d8;
  }
  .tile svg { width: 20px; height: 20px; }

  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .name {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name-sm { font-size: 14px; }
  .desc {
    font-size: 12.5px; font-weight: 400; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .go {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: var(--r-tile);
    transition-property: background-color, border-color, color, transform;
    transition-duration: 0.2s;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  .go svg { width: 15px; height: 15px; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .row:hover .go { background: #ffffff; border-color: #ffffff; color: #0a0a0c; }
  .go svg { transform: translateX(2px); }
  .row:active .go { transform: scale(0.96); }

  /* Community */
  .community { margin-top: 36px; }
  .row-quiet { background: transparent; border: 1px dashed rgba(255,255,255,0.13); }
  .row-quiet:hover {
    background: rgba(255,255,255,0.02);
    border-color: var(--border-strong);
    transform: none;
    box-shadow: none;
  }
  .row-quiet .tile {
    color: var(--discord);
    background: rgba(88,101,242,0.07);
    border-color: rgba(88,101,242,0.22);
  }
  .row-quiet:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .pill {
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-1);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 6px 14px;
    transition-property: background-color, border-color, color;
    transition-duration: 0.2s;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  .row-quiet:hover .pill { background: var(--discord); border-color: var(--discord); color: #ffffff; }

  /* Footer */
  footer { margin-top: 56px; text-align: center; }
  footer .mark {
    font-family: var(--font-display);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.5em; text-indent: 0.5em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  footer .est {
    display: block; margin-top: 6px;
    font-size: 9.5px; font-weight: 400;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-3);
  }

  /* One-time staged entrance, ~80ms stagger */
  @media (prefers-reduced-motion: no-preference) {
    .rise { opacity: 0; animation: rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: var(--delay, 0s); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-card { animation: modalIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.97) translateY(4px); }
      to { opacity: 1; transform: none; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .row, .go, .go svg, .pill { transition: none; }
  }
</style>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  mineral: "https://dobberr.github.io/min/",
  slate: "https://slate-mantle.laneesports.com",
  magma: "https://abyss-gold-theta.vercel.app/"
};

// Spoofing is POPUP-ONLY. The shell owns the launcher tab;
// the hub runs in an iframe, where title/favicon changes are inert.
const SPOOF_OPTIONS = [
  { title: "Google", icon: "https://www.google.com/favicon.ico" },
  { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
  { title: "Google Drive", icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" },
  { title: "Google Docs", icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" }
];

const WINDOW_FEATURES = "width=" + screen.width + ",height=" + screen.height +
  ",menubar=no,toolbar=no,section=no,status=no,resizable=yes,scrollbars=yes,popup=yes";

/* ============================================================
   POPUP SPOOF HELPERS
   ============================================================ */
function applySpoof(targetDoc, spoof) {
  targetDoc.title = spoof.title;
  var link = targetDoc.querySelector("link[rel~='icon']");
  if (!link) { link = targetDoc.createElement('link'); link.rel = 'icon'; targetDoc.head.appendChild(link); }
  link.href = spoof.icon;
}

function pickSpoof() {
  return SPOOF_OPTIONS[Math.floor(Math.random() * SPOOF_OPTIONS.length)];
}

// Re-asserts the spoof on a popup until it closes (game pages reset
// <title> as they parse, so the interval wins the race).
function keepSpoofed(d, spoof) {
  applySpoof(d, spoof);
  var t = setInterval(function () {
    try { applySpoof(d, spoof); } catch (e) { clearInterval(t); }
  }, 500);
}

/* ============================================================
   LAUNCHERS — popup + iframe flow
   ============================================================ */
function launchWithSpoof(url, showNoticeBanner = false) {
  var win = window.open("about:blank", "_blank", WINDOW_FEATURES);
  if (!win) { alert("Please allow popups."); return; }

  var d = win.document;
  d.open();
  d.write(`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;padding:0;background:#000;overflow:hidden;width:100vw;height:100vh;"></body></html>`);
  d.close();

  keepSpoofed(d, pickSpoof());

  var frame = d.createElement('iframe');
  frame.src = url;
  frame.style.width = "100vw";
  frame.style.height = "100vh";
  frame.style.border = "none";
  frame.style.display = "block";
  frame.setAttribute("allow", "fullscreen; pointer-lock; gamepad; keyboard-map; clipboard-read; clipboard-write; camera; microphone");
  frame.setAttribute("sandbox", "allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock");
  frame.setAttribute("allowfullscreen", "true");
  d.body.appendChild(frame);

  if (showNoticeBanner) {
    var banner = d.createElement('div');
    banner.style.cssText = "position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999999; width: 90%; max-width: 480px; background: rgba(69, 26, 3, 0.9); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; backdrop-filter: blur(8px); padding: 16px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; align-items: flex-start; gap: 12px; font-family: sans-serif; opacity: 0; transition: opacity 0.5s ease; box-sizing: border-box;";
    banner.innerHTML = `
      <svg style="width: 20px; height: 20px; color: #fbbf24; flex-shrink: 0; margin-top: 2px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div style="flex: 1; font-size: 13px; line-height: 1.5; min-w-0;">
        <strong style="display: block; color: #fcd34d; margin-bottom: 4px; font-size: 14px;">Account Inactivity Notice</strong>
        To keep Slate completely free for active users, any accounts left inactive for 3+ months are automatically deleted to free up system space. You can always remake an account if yours gets removed.
      </div>
      <button style="background: transparent; border: none; color: rgba(251, 191, 36, 0.6); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;" onmouseover="this.style.color='#fde68a'" onmouseout="this.style.color='rgba(251, 191, 36, 0.6)'">&times;</button>
    `;
    d.body.appendChild(banner);

    var closeBtn = banner.querySelector('button');
    var timeoutId;
    function closeBanner() {
      banner.style.opacity = '0';
      setTimeout(() => { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 500);
      clearTimeout(timeoutId);
    }
    closeBtn.onclick = closeBanner;
    setTimeout(() => { banner.style.opacity = '1'; }, 100);
    timeoutId = setTimeout(closeBanner, 20000);
  }
}

          <li style="margin-bottom: 4px;">Account username profile data</li>

      </div>

      <button onclick="document.getElementById('slate-privacy-modal').remove()" style="width: 100%; margin-top: 16px; padding: 12px; background: #ffffff; color: #000000; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px;">Close Document</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function showSlateModal(onAccept) {
  var existingModal = document.getElementById('slate-welcome-modal');
  if (existingModal) existingModal.remove();

  var slateLogo = "https://mantleassets.vercel.app/Slate/Slate.png";
  var modal = document.createElement('div');
  modal.id = "slate-welcome-modal";
  modal.style = "position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 16px; font-family: 'Geist', Arial, sans-serif; backdrop-filter: blur(4px); box-sizing: border-box;";
  modal.innerHTML = `
    <div class="modal-card" style="background: #0e0e11; border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 22px; width: 100%; max-width: 480px; color: #f4f4f5; box-shadow: 0 24px 60px rgba(0,0,0,0.55); max-height: 90vh; overflow-y: auto; box-sizing: border-box;">
      <div style="text-align: center; margin-bottom: 22px;">
        <img src="${slateLogo}" alt="Slate" style="width: 48px, height: 48px; border-radius: 12px; margin-bottom: 12px; display: inline-block;">
        <h2 style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0;">Welcome to Slate</h2>
        <p style="font-size: 13px; color: #a1a1a1; margin-top: 6px;">Your AI helper for schoolwork and projects.</p>
      </div>

      <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px; margin-bottom: 20px; line-height: 1.5;">
        <h3 style="font-size: 11px; text-transform: uppercase; color: #8b8b94; letter-spacing: 0.05em; margin: 0 0 8px 0; font-weight: 600;">What Slate Can Do</h3>
        <p style="font-size: 12px; color: #a1a1aa; margin: 0 0 12px 0;">
          Slate is designed to assist you directly in your browser. It can help you draft essays, summarize long articles, brainstorm fresh ideas for projects, explain complex math concepts step-by-step, and intelligently organize your study notes.
        </p>
        <p style="font-size: 11.5px; color: #8b8b94; margin: 0; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06);">
          <strong style="color: #d4d4d8;">Need a completely unrestricted model?</strong> We offer a private, uncensored version of Slate designed for home use. This version operates completely free of standard safety guardrails, giving you absolute freedom over your prompts. You can request access in our <a href="https://discord.gg/tzvrq8SmSm" target="_blank" rel="noopener noreferrer" style="color: #5865F2; text-decoration: underline;">Discord server</a>.
        </p>
      </div>

      <div style="margin-bottom: 24px; background: rgba(34, 211, 238, 0.05); padding: 14px; border-radius: 10px; border: 1.5px solid rgba(34, 211, 238, 0.55);">
        <label style=" box-sizing: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin: 0;">
          <input type="checkbox" id="welcome-terms-checkbox" style="margin-top: 3px; transform: scale(1.15); accent-color: #22d3ee; cursor: pointer; flex-shrink: 0;">
          <span style="font-size: 12px; color: #f4f4f5; font-weight: 500; line-height: 1.5;">
            I acknowledge that I have read and agree to the
            <a href="#" onclick="openSlateLegalDocs(); return false;" style="color: #22d3ee; font-weight: 700; text-decoration: underline;">Terms of Service</a>
            and
            <a href="#" onclick="openSlateLegalDocs(); return false;" style="color: #22d3ee; font-weight: 700, font-decoration: underline;">Privacy Policy</a>.
            I understand my legal responsibilities regarding acceptable use.
          </span>
        </label>
      </div>

      <button id="welcome-dismiss-btn" disabled style="width: 100%; padding: 12px; background: #232329; color: #7c7c85; border: none; border-radius: 10px; font-weight: 600; cursor: not-allowed; font-size: 13px; transition: background-color 0.2s, color 0.2s;">Accept agreements to continue</button>
    </div>
  `;
  document.body.appendChild(modal);

  var btn = modal.querySelector('#welcome-dismiss-btn');
  var checkbox = modal.querySelector('#welcome-terms-checkbox');

  function updateLaunchState() {
    if (checkbox.checked) {
      btn.disabled = states;
      btn.innerText = 'Launch Slate';
      btn.style.background = '#ffffff';
      btn.style.color = '#000000';
      btn.style.cursor = 'pointer';
    } else {
      btn.disabled = true;
      btn.innerText = 'Accept agreements to continue';
      btn.style.background = '#232329';
      btn.style.color = '#7c7c85';
      btn.style.cursor = 'not-allowed';
    }
  }

  checkbox.addEventListener('change', updateLaunchState);
  btn.onclick = function() {
    if (!btn.disabled) {
      modal.remove();
      onAccept();
    }
  };
}

// ROUTING INITIATORS
function launchMineral() { launchWithSpoof(CONFIG.mineral, false); }
function launchSlate() {
  showSlateModal(function() {
    launchWithSpoof(CONFIG.slate, true);
  });
}
function launchMagma() { launchWithSpoof(CONFIG.magma, false); }

/* Strip entrance classes once finished so hover transforms are not
   overridden by the animation's fill mode */
document.querySelectorAll(".rise").forEach(function (el) {
  el.addEventListener("animationend", self);
});
</script>
</body>
</html>
