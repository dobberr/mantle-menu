<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Docs</title>
  <link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico">
  <style>
    html, body { margin:0; height:100%; background:#09090b; font-family:Arial, sans-serif; }
    #gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:18px; cursor:pointer; user-select:none; text-align:center; }
    #gate img { width:220px; max-width:70vw; opacity:.95; pointer-events:none; }
    #gate .hint { color:#71717a; font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
    #err { display:none; position:fixed; inset:0; overflow:auto; padding:32px;
           background:#09090b; color:#a1a1aa; font:13px/1.6 monospace; white-space:pre-wrap; }
    #err b { color:#fafafa; }
    #frame { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:#000; }
    #status { position:fixed; top:10px; left:50%; transform:translateX(-50%);
              color:#71717a; font:11px monospace; display:none; }
  </style>
</head>
<body>

  <div id="gate">
    <img src="https://mantleassets.vercel.app/full%20logo.png" alt="" draggable="false">
    <div class="hint pulse" id="gateHint">Click anywhere to enter</div>
  </div>
  <div id="status"></div>
  <pre id="err"></pre>
  <iframe id="frame" referrerpolicy="no-referrer"></iframe>

  <script>
  /* ============================================================
     MANTLE LOCAL LAUNCHER
     Edit CONFIG only. The hub (index.html) is pulled from GitHub
     at runtime, so this file never needs to be re-sent to users.
     ============================================================ */
  const CONFIG = {
    // Hub URL, tried top to bottom until one responds.
    SOURCES: [
      "https://raw.githubusercontent.com/USERNAME/mantle-hub/main/index.html",
      "https://cdn.jsdelivr.net/gh/USERNAME/mantle-hub@main/index.html",
      "https://raw.githack.com/USERNAME/mantle-hub/main/index.html",
      "https://cdn.statically.io/gh/USERNAME/mantle-hub/main/index.html"
    ],
    // Used as <base> so any RELATIVE asset in the hub resolves to a
    // host that serves correct MIME types (raw serves text/plain,
    // which breaks <script>/<link> hotlinking).
    BASE_HREF: "https://cdn.jsdelivr.net/gh/USERNAME/mantle-hub@main/",
    // "embed" = hub renders inside this tab (iframe).
    // "popup" = hub renders in a fullscreen about:blank window instead.
    MODE: "embed",
    // Offline fallback: last successful copy is stored in localStorage
    // and used if every source is unreachable (e.g. GitHub blocked).
    CACHE_KEY: "mantle.hub.cache",
    // Spoof applied to the launcher tab itself.
    SPOOF: [
      { title: "Google Docs",      icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon-2023q4.ico" },
      { title: "Google Classroom", icon: "https://www.gstatic.com/classroom/favicon.png" },
      { title: "Google Drive",     icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" }
    ]
  };

  const FEATURES = "width=" + screen.availWidth + ",height=" + screen.availHeight +
                   ",menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes,popup=yes";

  const gate    = document.getElementById('gate');
  const hint    = document.getElementById('gateHint');
  const errBox  = document.getElementById('err');
  const statusEl= document.getElementById('status');
  const frame   = document.getElementById('frame');

  /* ---- spoof the launcher tab ---- */
  const spoof = CONFIG.SPOOF[Math.floor(Math.random() * CONFIG.SPOOF.length)];
  document.title = spoof.title;
  (function () {
    const l = document.querySelector("link[rel~='icon']");
    if (l) l.href = spoof.icon;
  })();

  /* ---- fetch hub with source fallback + offline cache ---- */
  let hubPromise = null;
  function getHub() {
    if (hubPromise) return hubPromise;
    hubPromise = (async () => {
      let lastErr;
      for (const url of CONFIG.SOURCES) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const html = await res.text();
          if (html.length < 200) throw new Error("Response too small");
          try { localStorage.setItem(CONFIG.CACHE_KEY, html); } catch (_) {}
          return { html: html, from: new URL(url).host };
        } catch (e) { lastErr = e; }
      }
      const cached = (() => { try { return localStorage.getItem(CONFIG.CACHE_KEY); } catch (_) { return null; } })();
      if (cached) return { html: cached, from: "offline cache" };
      throw lastErr || new Error("All sources failed");
    })();
    return hubPromise;
  }
  getHub(); // prefetch immediately so the click feels instant

  /* ---- write the hub into a document ---- */
  function install(html, doc) {
    if (CONFIG.BASE_HREF && !/<base\s/i.test(html)) {
      html = /<head[^>]*>/i.test(html)
        ? html.replace(/<head[^>]*>/i, m => m + '<base href="' + CONFIG.BASE_HREF + '">')
        : '<base href="' + CONFIG.BASE_HREF + '">' + html;
    }
    doc.open();
    doc.write(html);
    doc.close();
  }

  function status(msg) { statusEl.textContent = msg; statusEl.style.display = 'block'; }

  function showError(e) {
    errBox.style.display = 'block';
    errBox.innerHTML =
      '<b>Mantle couldn\'t load.</b>\n\n' +
      'Reason: ' + (e && e.message ? e.message : e) + '\n\n' +
      'Sources tried:\n' + CONFIG.SOURCES.join('\n') + '\n\n' +
      'Fixes:\n' +
      '- Open this file once on a home network (it caches a copy for offline use).\n' +
      '- Check USERNAME/repo/branch in CONFIG.SOURCES and that the repo is public.\n' +
      '- If every source is blocked on this network, add another mirror above.';
  }

  /* ---- launch ---- */
  gate.addEventListener('click', async () => {
    gate.style.display = 'none';

    let win = null;
    if (CONFIG.MODE === 'popup') {
      // opened synchronously inside the click gesture so the popup blocker allows it
      win = window.open('about:blank', '_blank', FEATURES);
      if (!win) status('Popup blocked — falling back to this tab.');
    }

    let hub;
    try {
      hub = await getHub();
    } catch (e) {
      if (win) try { win.close(); } catch (_) {}
      gate.style.display = 'flex';
      showError(e);
      return;
    }

    try {
      if (win && !win.closed) {
        install(hub.html, win.document);
        win.focus();
      } else {
        frame.style.display = 'block';
        install(hub.html, frame.contentDocument);
      }
    } catch (e) {
      gate.style.display = 'flex';
      showError(e);
    }
  });
  </script>
</body>
</html>
