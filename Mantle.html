<style>
  :root { color-scheme: dark; --bg: #0a0a0b; --surface: #0f0f11; --border: rgba(255,255,255,0.08); --text-1: #fafafa; --text-2: #b0b0b3; --text-3: #9a9a9d; --ease: cubic-bezier(0.4, 0, 0.2, 1); }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text-1); font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity 0.25s var(--ease); }
  #loader img { width: 260px; max-width: 70vw; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .wordmark { display: none; color: var(--text-1); font-weight: 700; font-size: 18px; letter-spacing: 0.45em; text-indent: 0.45em; }
  .loadbar { width: 140px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; position: relative; }
  .loadbar::after { content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 40%; background: rgba(255,255,255,0.5); border-radius: 2px; animation: sweep 1.3s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  #error { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; transition: opacity 0.25s var(--ease); }
  .error-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 28px; text-align: center; box-sizing: border-box; }
  .error-card img { width: 190px; max-width: 60%; height: auto; margin: 0 auto 20px; display: block; opacity: 0.92; pointer-events: none; -webkit-user-drag: none; }
  .error-card .wordmark { display: inline-block; margin-bottom: 20px; font-size: 15px; }
  .error-card h1 { color: var(--text-1); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  .error-card p { color: var(--text-3); font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
  #retry { background: #fafafa; color: #0a0a0b; border: 0; border-radius: 8px; padding: 10px 24px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background-color 0.15s var(--ease); }
  #retry:hover { background: #e4e4e7; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
</style>
